name: fujin
description: Copies a MyFitnessPal food diary into Ekklo, the coach's nutrition app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.9

dependencies:
  dart_mappable: ^4.10.0
  ekklo_client:
    git:
      url: https://github.com/Ozne-l/ekklo_client.git
      ref: main
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  hooks_riverpod: ^3.4.3
  http: ^1.6.0
  intl: any
  motor: ^1.1.0
  myfitnesspal_client:
    git:
      url: https://github.com/Ozne-l/myfitnesspal_client.git
      ref: main
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: ^2.15.1
  checks: ^0.3.2
  dart_mappable_builder: ^4.10.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/weather/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Hina Mincho
      fonts:
        - asset: assets/fonts/hinamincho/HinaMincho-Regular.ttf
          weight: 400
